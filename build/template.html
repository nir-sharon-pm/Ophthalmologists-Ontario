<title>Glaucoma Referral Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>/*LEAFLET_CSS*/</style>
<style>
/* Layout: referral desk — search bar on top, ranked list on the left, live vector map on the right; stacks map-over-list on phones. */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --ink:#14212e; --muted:#5a6878; --line:#dbe2e9;
  --accent:#1f5fbf; --accent-ink:#ffffff; --top:#d98a00; --top-soft:#fff4dc; --top-ink:#5c3a00;
  --water:#cfe0ee; --land:#fbfbf8; --land-us:#eef0ec; --border:#9aa7b4; --road:#e3c9a4; --urban:#efe7da;
  --label:#3a4654; --patient:#c2185b; --warn:#9a5b00; --warn-soft:#fdf1df;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f151c; --panel:#161e27; --ink:#e6edf3; --muted:#9aa8b6; --line:#2a3542;
  --accent:#6ea8ff; --accent-ink:#0b1420; --top:#f0a926; --top-soft:#2e2412; --top-ink:#ffd98f;
  --water:#13283b; --land:#1b232c; --land-us:#171d24; --border:#4b5967; --road:#4a4032; --urban:#262b2f;
  --label:#b9c4cf; --patient:#ff5fa2; --warn:#f0b35a; --warn-soft:#2c2414; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f151c; --panel:#161e27; --ink:#e6edf3; --muted:#9aa8b6; --line:#2a3542;
  --accent:#6ea8ff; --accent-ink:#0b1420; --top:#f0a926; --top-soft:#2e2412; --top-ink:#ffd98f;
  --water:#13283b; --land:#1b232c; --land-us:#171d24; --border:#4b5967; --road:#4a4032; --urban:#262b2f;
  --label:#b9c4cf; --patient:#ff5fa2; --warn:#f0b35a; --warn-soft:#2c2414; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%}
header{background:var(--panel);border-bottom:1px solid var(--line);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.brand p{margin:0;color:var(--muted);font-size:13px}
form.search{flex:1 1 420px;display:flex;gap:8px;min-width:0;flex-wrap:wrap}
.search label{position:absolute;left:-9999px}
.search input{flex:1 1 220px;min-width:0;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);font-size:16px}
.search input:focus{border-color:var(--accent);outline:none}
.btn{border:0;border-radius:8px;padding:10px 16px;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:hover{filter:brightness(1.08)}
.status{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.live{background:#2e9d5b;box-shadow:0 0 0 3px color-mix(in srgb,#2e9d5b 25%,transparent)}
main{flex:1;display:grid;grid-template-columns:minmax(340px,430px) 1fr;min-height:0}
aside{border-right:1px solid var(--line);background:var(--panel);overflow:auto;min-width:0;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}
#map{height:100%;min-height:300px;background:var(--water)}
.mapwrap{position:relative;min-width:0}
.listhead h2{font-size:15px;margin:0 0 2px;font-weight:600}
.listhead .sub{color:var(--muted);font-size:13px;margin:0 0 10px}
.msg{font-size:13.5px;padding:8px 10px;border-radius:8px;background:var(--warn-soft);color:var(--warn);margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;background:var(--panel);cursor:pointer;font-family:var(--cond);font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--bg)}
.sw{width:10px;height:10px;border-radius:50%;flex:none}
.cards{display:flex;flex-direction:column;gap:10px}
.group{font-family:var(--cond);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 0;display:flex;align-items:center;gap:6px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel);display:grid;grid-template-columns:auto 1fr;gap:4px 12px;min-width:0}
.card.top{border:2px solid var(--top);background:var(--top-soft)}
.card.sel{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.rank{grid-row:span 3;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-family:var(--mono);background:var(--bg);border:1px solid var(--line);font-size:14px}
.card.top .rank{background:var(--top);color:#1b1200;border:0;width:40px;height:40px;font-size:18px}
.rank.none{visibility:hidden;width:0;height:0;border:0}
.card .who{min-width:0}
.name{font-weight:600;font-size:15.5px;margin:0}
.card.top .name{font-size:17px}
.focus{color:var(--muted);font-size:13px;margin:0}
.where{font-size:13.5px;margin:4px 0 0;min-width:0}
.where b{font-weight:500}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12.5px;margin-top:4px}
.dist{font-family:var(--mono);font-weight:500;font-size:13px}
.card.top .dist{color:var(--top-ink);font-size:14px}
.citytag{display:inline-flex;align-items:center;gap:5px;font-family:var(--cond);font-weight:600;font-size:12px}
.tier{font-size:11.5px;border:1px solid var(--warn);color:var(--warn);border-radius:4px;padding:0 5px}
.contacts{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;font-size:13px;margin-top:6px;align-items:center;min-width:0}
.contacts dt{color:var(--muted);font-family:var(--cond);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.contacts dd{margin:0;font-family:var(--mono);font-size:13px;overflow-wrap:anywhere;user-select:all}
.contacts dd.na{font-family:var(--sans);color:var(--muted);user-select:auto;font-style:italic}
.copy{border:1px solid var(--line);background:transparent;border-radius:6px;font-size:11.5px;padding:1px 7px;cursor:pointer;color:var(--muted)}
.copy:hover{color:var(--ink);border-color:var(--ink)}
.foot{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:6px;font-size:12.5px}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:500;text-decoration:underline;text-underline-offset:2px}
.note{grid-column:1/-1;color:var(--muted);font-size:12.5px;margin:4px 0 0}
.alt{grid-column:1/-1;font-size:12.5px;color:var(--muted);margin:2px 0 0}
a{color:var(--accent)}
.about{margin-top:18px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.about p{margin:0 0 6px}
/* map overlays */
.regions{position:absolute;z-index:500;top:10px;left:calc(10px + env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 70px)}
@media (max-width:820px){.regions{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.regions button{flex:none}.legend{font-size:11px;gap:8px}}
.regions button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;font-family:var(--cond);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.legend{position:absolute;z-index:500;bottom:10px;left:calc(10px + env(safe-area-inset-left,0px));background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;display:flex;gap:12px;flex-wrap:wrap;max-width:calc(100% - 20px)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.lg-pin{width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid var(--panel)}
.lg-top{width:14px;height:14px;border-radius:50%;background:var(--top)}
.lg-pt{width:12px;height:12px;border-radius:50%;background:var(--patient)}
.leaflet-container{background:var(--water);font-family:var(--sans)}
.city-label{font-family:var(--cond);font-weight:600;font-size:12px;color:var(--label);white-space:nowrap;text-shadow:0 0 3px var(--land),0 0 3px var(--land),0 0 2px var(--land);pointer-events:none;letter-spacing:.02em}
.city-label.major{font-size:13.5px;text-transform:uppercase;letter-spacing:.08em}
.pin{display:flex;align-items:center;gap:4px;white-space:nowrap;transform:translate(-14px,-14px)}
.pin .b{min-width:28px;height:28px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--mono);font-size:13px;border:2.5px solid var(--panel);box-shadow:0 1px 4px rgba(0,0,0,.35);padding:0 6px}
.pin .t{font-family:var(--cond);font-weight:600;font-size:12px;background:var(--panel);color:var(--ink);border-radius:4px;padding:1px 6px;box-shadow:0 1px 3px rgba(0,0,0,.25);border-left:4px solid var(--c)}
.pin.cl .b{min-width:34px;height:34px;border-radius:17px;font-size:14px}
.pin.top .b{outline:3px solid var(--top);outline-offset:1px}
.pin .r{background:var(--top);color:#1b1200;font-weight:700;font-family:var(--mono);border-radius:10px;padding:0 6px;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.ptmark{transform:translate(-11px,-11px);display:flex;align-items:center;gap:6px;white-space:nowrap}
.ptmark i{width:22px;height:22px;border-radius:50%;background:var(--patient);border:3px solid var(--panel);box-shadow:0 0 0 0 var(--patient);animation:pulse 2s infinite}
.ptmark b{background:var(--patient);color:#fff;font-size:12px;padding:1px 7px;border-radius:4px;font-family:var(--cond)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--patient) 60%,transparent)}100%{box-shadow:0 0 0 16px transparent}}
@media (prefers-reduced-motion:reduce){.ptmark i{animation:none}}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--ink)}
.leaflet-popup-content{margin:10px 12px;font-size:13px;min-width:220px}
.pop h3{margin:0 0 4px;font-size:14px}
.pop .addr{color:var(--muted);margin:0 0 6px}
.pop ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.pop li b{display:block}
.pop .ph{font-family:var(--mono);font-size:12px}
.leaflet-bar a{background:var(--panel);color:var(--ink);border-color:var(--line)}
@media (max-width:820px){
  .app{height:auto}
  main{grid-template-columns:1fr;grid-template-rows:auto auto}
  .mapwrap{order:-1;height:56vh}
  aside{border-right:0;padding-right:max(16px,env(safe-area-inset-right,0px));overflow:visible}
  .status{order:3}
}
</style>

<div class="app">
<header>
  <div class="brand"><h1>Glaucoma Referral Map</h1><p>Glaucoma specialists, Windsor to Montréal</p></div>
  <form class="search" id="f" autocomplete="off">
    <label for="q">Patient's new location</label>
    <input id="q" list="places" placeholder="Patient's new location: postal code (e.g. K7L), city or address" enterkeyhint="search">
    <datalist id="places"></datalist>
    <button class="btn" type="submit">Find nearest</button>
    <button class="btn ghost" type="button" id="clear" hidden>Clear</button>
  </form>
  <div class="status" id="status"><span class="dot"></span><span>Loading data…</span></div>
</header>
<main>
  <aside id="list" aria-live="polite"></aside>
  <div class="mapwrap">
    <div id="map" role="application" aria-label="Map of glaucoma specialists"></div>
    <div class="regions" id="regions"></div>
    <div class="legend"><span><i class="lg-pin"></i>Clinic (number = doctors)</span><span><i class="lg-top"></i>Top 3 nearest</span><span><i class="lg-pt"></i>Patient</span></div>
  </div>
</main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const BASE=/*BASE*/;
const GAZ=/*GAZ*/;
const SNAPSHOT=/*SNAP*/;
const SNAPSHOT_DATE="/*DATE*/";
</script>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- city colours (west → east) ---------- */
const CITY_COLORS={"Windsor":"#7b4fbf","London":"#c0392b","Brantford":"#8d6e3f","Hamilton":"#d35400","Oakville":"#16a085","Mississauga":"#5d8a1f","Brampton":"#2e86c1","Vaughan":"#a04070","Toronto":"#1f5fbf","North York":"#0e7c86","Markham":"#8e44ad","Kingston":"#b7950b","Ottawa":"#c2185b","Gatineau":"#6d4c41","Montréal":"#27864a"};
const cityColor=c=>CITY_COLORS[c]||"#5a6878";

/* ---------- state ---------- */
let doctors=sanitize(SNAPSHOT), patient=null, ranking=null, filterCity="All", selected=null, metaInfo=null;

function sanitize(arr){
  return (Array.isArray(arr)?arr:[]).filter(d=>d&&typeof d.name==="string"&&Array.isArray(d.locations)&&d.locations.length)
    .map(d=>({...d,locations:d.locations.filter(l=>isFinite(+l.lat)&&isFinite(+l.lng)).map(l=>({...l,lat:+l.lat,lng:+l.lng}))}))
    .filter(d=>d.locations.length);
}
function km(a,b){const R=6371,r=Math.PI/180,dl=(b.lat-a.lat)*r,dg=(b.lng-a.lng)*r;const h=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h));}

/* ---------- theme tokens for the map ---------- */
const tok=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------- map ---------- */
const map=L.map("map",{zoomSnap:.5,zoomDelta:.5,minZoom:5.5,maxZoom:16,attributionControl:false,worldCopyJump:false,maxBounds:[[39.5,-88],[49,-69]],zoomControl:false});
L.control.zoom({position:"topright"}).addTo(map);
const VIEW_ALL=[[41.9,-83.3],[46.0,-73.2]];
map.fitBounds(VIEW_ALL);
let baseLayers=[];
function drawBase(){
  baseLayers.forEach(l=>map.removeLayer(l));baseLayers=[];
  const add=l=>{l.addTo(map);baseLayers.push(l);};
  add(L.geoJSON(BASE.prov,{interactive:false,style:f=>({fillColor:/Ontario|Qu[ée]bec/.test(f.properties.name||"")?tok("--land"):tok("--land-us"),fillOpacity:1,color:tok("--border"),weight:1.2})}));
  add(L.geoJSON(BASE.urban,{interactive:false,style:{fillColor:tok("--urban"),fillOpacity:1,stroke:false}}));
  add(L.geoJSON(BASE.lakes,{interactive:false,style:{fillColor:tok("--water"),fillOpacity:1,color:tok("--water"),weight:1}}));
  add(L.geoJSON(BASE.rivers,{interactive:false,style:{color:tok("--water"),weight:2.5}}));
  add(L.geoJSON(BASE.roads,{interactive:false,style:{color:tok("--road"),weight:1.4,opacity:.9}}));
}
drawBase();

/* reference city labels for orientation (GTA municipalities shown separately) */
function gz(name,prov){const v=GAZ.C[name.toUpperCase()+"|"+(prov||"ON")];return v?{lat:v[0],lng:v[1]}:null;}
const REF=[["Windsor",5.5,1],["Sarnia",7],["London",5.5,1],["Kitchener",7],["Guelph",8],["Brantford",8],["Hamilton",6.5,1],["St Catharines",8,0,"St. Catharines"],["Oakville",8],["Mississauga",8],["Brampton",8],["Vaughan",9],["Toronto",5.5,1],["North York",9.5],["Scarborough",9.5],["Etobicoke",9.5],["Markham",8.5],["Richmond Hill",9.5],["Oshawa",8],["Barrie",7.5],["Peterborough",7.5],["Belleville",7.5],["Kingston",6,1],["Brockville",8],["Cornwall",7.5],["Ottawa",5.5,1],["Gatineau",9,0,null,"QC"],["Montreal",5.5,1,"Montréal","QC"],["Laval",8.5,0,null,"QC"]];
const refLabels=REF.map(([n,z,major,disp,prov])=>{const p=gz(n,prov);if(!p)return null;
  const m=L.marker(p,{interactive:false,keyboard:false,icon:L.divIcon({className:"",html:`<span class="city-label${major?" major":""}">${esc(disp||n)}</span>`,iconSize:null})});m._minZ=z;return m;}).filter(Boolean);
let pinPts=[];
function updateLabels(){const z=map.getZoom();refLabels.forEach(m=>{const lp=map.latLngToLayerPoint(m.getLatLng());const on=z>=m._minZ&&!pinPts.some(p=>Math.abs(p.x-lp.x)<90&&Math.abs(p.y-lp.y)<22);if(on&&!map.hasLayer(m))m.addTo(map);else if(!on&&map.hasLayer(m))map.removeLayer(m);});}

/* region shortcuts */
const REGIONS=[["All",VIEW_ALL],["Windsor–London",[[42.1,-83.2],[43.3,-80.9]]],["GTA & Hamilton",[[43.15,-80.0],[43.95,-79.1]]],["Downtown Toronto",[[43.63,-79.47],[43.68,-79.36]]],["Kingston–Ottawa",[[44.1,-76.7],[45.5,-75.4]]],["Montréal",[[45.43,-73.72],[45.6,-73.5]]]];
$("#regions").innerHTML=REGIONS.map((r,i)=>`<button type="button" data-i="${i}">${esc(r[0])}</button>`).join("");
$("#regions").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;map.flyToBounds(REGIONS[+b.dataset.i][1],{duration:.6});});

/* ---------- sites & clustering ---------- */
let siteLayer=L.layerGroup().addTo(map), extraLayer=L.layerGroup().addTo(map);
function buildSites(){
  const m=new Map();
  doctors.forEach(d=>d.locations.forEach((l,li)=>{
    if(filterCity!=="All"&&l.city!==filterCity)return;
    const k=l.lat.toFixed(4)+","+l.lng.toFixed(4);
    if(!m.has(k))m.set(k,{lat:l.lat,lng:l.lng,city:l.city,clinic:l.clinic,address:l.address,docs:[]});
    m.get(k).docs.push({d,l});
  }));
  return [...m.values()];
}
function rankOf(id){if(!ranking)return 0;const i=ranking.findIndex(r=>r.d.id===id);return i>=0&&i<3?i+1:0;}
function siteBestRank(s){let b=0;s.docs.forEach(x=>{if(!ranking)return;const r=ranking.findIndex(q=>q.d.id===x.d.id&&q.loc===x.l);if(r>=0&&r<3&&(!b||r+1<b))b=r+1;});return b;}
function shortClinic(c){return String(c).replace(/,.*$/,"").replace(/^Glaucoma Clinic$/,"Toronto Western").slice(0,40);}
function drawSites(){
  siteLayer.clearLayers();
  const sites=buildSites(), z=map.getZoom();
  const pts=sites.map(s=>({s,p:map.latLngToLayerPoint([s.lat,s.lng])}));
  const R=z>=12?30:44, clusters=[];
  pts.sort((a,b)=>siteBestRank(a.s)?-1:siteBestRank(b.s)?1:0);
  pts.forEach(pt=>{const c=clusters.find(c=>c.p.distanceTo(pt.p)<R);if(c){c.items.push(pt.s);}else clusters.push({p:pt.p,items:[pt.s]});});
  pinPts=clusters.map(c=>map.latLngToLayerPoint(c.items.length===1?[c.items[0].lat,c.items[0].lng]:L.latLngBounds(c.items.map(s=>[s.lat,s.lng])).getCenter()).add([40,0]));
  clusters.forEach(c=>{
    const n=c.items.reduce((a,s)=>a+s.docs.length,0);
    const cities=[...new Set(c.items.map(s=>s.city))];
    const best=Math.min(...c.items.map(s=>siteBestRank(s)||99));
    const color=cityColor(cities[0]);
    let html,single=c.items.length===1;
    const label=single?(z>=10.5?shortClinic(c.items[0].clinic):c.items[0].city):(cities.length===1?cities[0]:cities.slice(0,2).join(" · ")+(cities.length>2?" +":""));
    html=`<div class="pin${single?"":" cl"}${best<99?" top":""}" style="--c:${color}"><span class="b" style="background:${color}">${n}</span><span class="t">${esc(label)}</span>${best<99?`<span class="r">#${best}</span>`:""}</div>`;
    const ll=single?[c.items[0].lat,c.items[0].lng]:L.latLngBounds(c.items.map(s=>[s.lat,s.lng])).getCenter();
    const mk=L.marker(ll,{icon:L.divIcon({className:"",html,iconSize:null}),zIndexOffset:best<99?1000-best:0,title:label+" – "+n+" doctor"+(n>1?"s":""),keyboard:true});
    if(single){mk.bindPopup(()=>popupHtml(c.items[0]),{maxWidth:320});}
    else mk.on("click",()=>map.flyToBounds(L.latLngBounds(c.items.map(s=>[s.lat,s.lng])).pad(.6),{duration:.5,maxZoom:15}));
    mk.addTo(siteLayer);
  });
}
function popupHtml(s){
  return `<div class="pop"><h3>${esc(s.clinic)}</h3><p class="addr">${esc(s.address)}</p><ul>${s.docs.map(({d,l})=>{const r=rankOf(d.id);
    return `<li><b>${r?"#"+r+" · ":""}${esc(d.name)}</b><span class="ph">${l.phone?"T "+esc(l.phone):"Phone: call clinic"}${l.fax?" · F "+esc(l.fax):""}</span>${l.email?`<br><span class="ph">${esc(l.email)}</span>`:""}</li>`;}).join("")}</ul></div>`;
}
map.on("zoomend",()=>{drawSites();updateLabels();});
map.on("moveend",updateLabels);

/* ---------- patient + ranking ---------- */
function computeRanking(){
  if(!patient){ranking=null;return;}
  ranking=doctors.map(d=>{let best=null;d.locations.forEach(l=>{const k=km(patient,l);if(!best||k<best.km)best={d,loc:l,km:k};});return best;})
    .filter(r=>filterCity==="All"||r.loc.city===filterCity).sort((a,b)=>a.km-b.km);
}
function drawPatient(){
  extraLayer.clearLayers();
  if(!patient)return;
  L.marker(patient,{zIndexOffset:2000,icon:L.divIcon({className:"",html:`<div class="ptmark"><i></i><b>Patient · ${esc(patient.label)}</b></div>`,iconSize:null})}).addTo(extraLayer);
  (ranking||[]).slice(0,3).forEach(r=>L.polyline([[patient.lat,patient.lng],[r.loc.lat,r.loc.lng]],{color:tok("--top"),weight:2.5,dashArray:"6 6",interactive:false}).addTo(extraLayer));
}
function fitPatient(){
  if(!patient||!ranking||!ranking.length)return;
  const b=L.latLngBounds([[patient.lat,patient.lng]]);ranking.slice(0,3).forEach(r=>b.extend([r.loc.lat,r.loc.lng]));
  map.flyToBounds(b.pad(.25),{duration:.7,maxZoom:13});
}

/* ---------- list ---------- */
function citiesInData(){const s=new Set();doctors.forEach(d=>d.locations.forEach(l=>s.add(l.city)));const avg=c=>{let n=0,t=0;doctors.forEach(d=>d.locations.forEach(l=>{if(l.city===c){t+=l.lng;n++;}}));return t/n;};return [...s].sort((a,b)=>avg(a)-avg(b));}
function contactRow(label,val,kind){
  if(!val)return `<dt>${label}</dt><dd class="na">${kind==="email"?"Not published":"Not published – call clinic"}</dd><span></span>`;
  return `<dt>${label}</dt><dd>${esc(val)}</dd><button class="copy" type="button" data-copy="${esc(val)}" aria-label="Copy ${label}">Copy</button>`;
}
function card(d,loc,rank,distKm){
  const top=rank&&rank<=3, others=d.locations.filter(l=>l!==loc);
  return `<article class="card${top?" top":""}${selected===d.id?" sel":""}" data-id="${esc(d.id)}">
    <span class="rank${rank?"":" none"}">${rank||""}</span>
    <div class="who"><p class="name">${esc(d.name)}</p><p class="focus">${esc(d.focus||"Glaucoma")}</p></div>
    <div class="where"><b>${esc(loc.clinic)}</b><br>${esc(loc.address)}
      <div class="meta"><span class="citytag"><span class="sw" style="background:${cityColor(loc.city)}"></span>${esc(loc.city)}</span>${distKm!=null?`<span class="dist">${distKm<10?distKm.toFixed(1):Math.round(distKm)} km away</span>`:""}${d.tier==="care"?`<span class="tier">Glaucoma care · subspecialty unconfirmed</span>`:""}</div></div>
    <dl class="contacts">${contactRow("Phone",loc.phone)}${contactRow("Fax",loc.fax)}${contactRow("Email",loc.email,"email")}</dl>
    ${others.length?`<p class="alt">Also sees patients at: ${others.map(o=>esc(o.clinic+", "+o.city)).join("; ")}</p>`:""}
    ${d.note?`<p class="note">${esc(d.note)}</p>`:""}
    <div class="foot"><button class="link" type="button" data-show="${esc(d.id)}" data-lat="${loc.lat}" data-lng="${loc.lng}">Show on map</button>${(d.sources||[]).slice(0,2).map((u,i)=>/^https:\/\//.test(u)?`<a href="${esc(u)}" target="_blank" rel="noopener">Source ${i+1}</a>`:"").join("")}</div>
  </article>`;
}
function renderList(){
  const el=$("#list"), cities=citiesInData();
  const chips=`<div class="chips" role="group" aria-label="Filter by city">${["All",...cities].map(c=>`<button type="button" class="chip" data-city="${esc(c)}" aria-pressed="${filterCity===c}">${c==="All"?"":`<span class="sw" style="background:${cityColor(c)}"></span>`}${esc(c==="All"?"All cities":c)}</button>`).join("")}</div>`;
  let body="", head;
  if(ranking){
    head=`<div class="listhead"><h2>Nearest to ${esc(patient.label)}</h2><p class="sub">Straight-line distance. Top 3 are highlighted on the map.</p></div>`;
    body=ranking.map((r,i)=>card(r.d,r.loc,i+1,r.km)).join("");
    if(!ranking.length)body=`<p class="msg">No doctors in ${esc(filterCity)}. Choose "All cities".</p>`;
  }else{
    const n=doctors.length;
    head=`<div class="listhead"><h2>${n} glaucoma specialists</h2><p class="sub">Enter the patient's new location above to rank them by distance.</p></div>`;
    cities.filter(c=>filterCity==="All"||c===filterCity).forEach(c=>{
      const rows=[];doctors.forEach(d=>d.locations.forEach(l=>{if(l.city===c&&!rows.some(r=>r.d===d))rows.push({d,l});}));
      body+=`<p class="group"><span class="sw" style="background:${cityColor(c)}"></span>${esc(c)} · ${rows.length}</p>`+rows.map(r=>card(r.d,r.l,0,null)).join("");
    });
  }
  el.innerHTML=head+(geoMsg?`<p class="msg">${esc(geoMsg)}</p>`:"")+chips+`<div class="cards">${body}</div>`+aboutHtml();
}
function aboutHtml(){
  return `<div class="about"><p><b>About this data.</b> Compiled from hospital, university and physician-directory pages (sources linked on each card). Phone and fax numbers often go to the clinic's referral desk. Emails are shown only where a clinic publishes one.</p><p>Confirm the referral fax by phone before sending patient information. Distances are straight-line, not driving.</p><p>${statusText()}</p></div>`;
}
let geoMsg="";

/* ---------- interactions ---------- */
$("#list").addEventListener("click",async e=>{
  const c=e.target.closest("[data-copy]");
  if(c){const v=c.dataset.copy;try{await navigator.clipboard.writeText(v);c.textContent="Copied";}catch{const dd=c.previousElementSibling;const r=document.createRange();r.selectNodeContents(dd);const s=getSelection();s.removeAllRanges();s.addRange(r);c.textContent="Selected";}setTimeout(()=>c.textContent="Copy",1400);return;}
  const ch=e.target.closest("[data-city]");
  if(ch){filterCity=ch.dataset.city;computeRanking();refresh();if(!patient&&filterCity!=="All"){const pts=[];doctors.forEach(d=>d.locations.forEach(l=>{if(l.city===filterCity)pts.push([l.lat,l.lng]);}));if(pts.length)map.flyToBounds(L.latLngBounds(pts).pad(.5),{maxZoom:13,duration:.6});}return;}
  const sh=e.target.closest("[data-show]");
  if(sh){selected=sh.dataset.show;const ll=[+sh.dataset.lat,+sh.dataset.lng];map.flyTo(ll,Math.max(map.getZoom(),13.5),{duration:.6});
    map.once("moveend",()=>{siteLayer.eachLayer(m=>{const p=m.getLatLng();if(Math.abs(p.lat-ll[0])<1e-4&&Math.abs(p.lng-ll[1])<1e-4&&m.getPopup())m.openPopup();});});
    document.querySelectorAll(".card.sel").forEach(x=>x.classList.remove("sel"));sh.closest(".card").classList.add("sel");
    if(matchMedia("(max-width:820px)").matches)$("#map").scrollIntoView({behavior:"smooth"});}
});

/* ---------- geocoding (offline: Canada Post FSA + place centroids, ON & QC) ---------- */
const norm=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/\bSAINTE?\b\.?/g,m=>m.startsWith("SAINTE")?"STE":"ST").replace(/\bST\.?\b/g,"ST").replace(/[^A-Z0-9 ]/g," ").replace(/\s+/g," ").trim();
const CITY_INDEX=(()=>{const m=new Map();Object.entries(GAZ.C).forEach(([k,v])=>{const [name,prov]=k.split("|");const n=norm(name);const cur=m.get(n);if(!cur||v[2]>cur.n)m.set(n,{name,prov,lat:v[0],lng:v[1],n:v[2]});});
  [["GTA","TORONTO"],["MONTREAL QC","MONTREAL"],["OTTAWA ON","OTTAWA"],["NIAGARA","NIAGARA FALLS"],["KW","KITCHENER"],["THE SOO","SAULT STE MARIE"]].forEach(([a,b])=>{if(m.get(b))m.set(a,m.get(b));});return m;})();
const titleCase=s=>s.toLowerCase().replace(/(^|[\s-])\S/g,c=>c.toUpperCase()).replace(/\bSt\b/g,"St.");
function geocode(q){
  const raw=String(q).toUpperCase();
  const pc=raw.match(/\b([A-Z]\d[A-Z])\s?(\d[A-Z]\d)?\b/);
  if(pc&&GAZ.F[pc[1]]){const f=GAZ.F[pc[1]];return {lat:f[0],lng:f[1],label:pc[1]+(pc[2]?" "+pc[2]:"")+" ("+titleCase(f[2])+")"};}
  let s=norm(q).replace(/\b(ONTARIO|ON|QUEBEC|QC|CANADA)\b/g," ").replace(/\s+/g," ").trim();
  if(CITY_INDEX.has(s)){const c=CITY_INDEX.get(s);return {lat:c.lat,lng:c.lng,label:titleCase(c.name)};}
  const parts=String(q).split(",").map(p=>norm(p).replace(/\b(ONTARIO|ON|QUEBEC|QC|CANADA)\b/g," ").replace(/\s+/g," ").trim()).filter(Boolean).reverse();
  for(const p of parts){if(CITY_INDEX.has(p)){const c=CITY_INDEX.get(p);return {lat:c.lat,lng:c.lng,label:titleCase(c.name)};}}
  const w=s.split(" ");for(let len=Math.min(4,w.length);len>=1;len--)for(let i=w.length-len;i>=0;i--){const g=w.slice(i,i+len).join(" ");if(g.length>2&&CITY_INDEX.has(g)){const c=CITY_INDEX.get(g);return {lat:c.lat,lng:c.lng,label:titleCase(c.name)};}}
  for(const [k,c] of CITY_INDEX){if(s.length>=4&&k.startsWith(s))return {lat:c.lat,lng:c.lng,label:titleCase(c.name)};}
  return null;
}
async function askClaude(q){
  try{const sample=window.claude&&claude.use?await claude.use("sample"):null;if(!sample)return null;
    const r=await sample.json(`Give the approximate latitude and longitude of this place in Ontario or Quebec, Canada: "${q.slice(0,200)}". Reply as JSON {"lat":number,"lng":number,"label":"short place name"} or {"lat":null} if unknown.`,{modelTier:"quick"});
    if(r&&isFinite(r.lat)&&isFinite(r.lng)&&r.lat>41&&r.lat<47.5&&r.lng>-84&&r.lng<-72)return {lat:+r.lat,lng:+r.lng,label:String(r.label||q).slice(0,40)};
  }catch{}return null;
}
$("#f").addEventListener("submit",async e=>{
  e.preventDefault();const q=$("#q").value.trim();if(!q)return;
  geoMsg="";let g=geocode(q);
  if(!g){geoMsg="Looking up that place…";renderList();g=await askClaude(q);}
  if(!g){geoMsg=`Couldn't place "${q}". Try a postal code (e.g. L4C 2N9 or just L4C) or a town name.`;renderList();return;}
  geoMsg="";patient=g;computeRanking();refresh();fitPatient();$("#clear").hidden=false;
  if(matchMedia("(max-width:820px)").matches)$("#map").scrollIntoView({behavior:"smooth"});
});
$("#clear").addEventListener("click",()=>{patient=null;ranking=null;geoMsg="";$("#q").value="";$("#clear").hidden=true;refresh();map.flyToBounds(VIEW_ALL,{duration:.6});});
(function fillPlaces(){const names=[...CITY_INDEX.values()].sort((a,b)=>b.n-a.n).slice(0,700).map(c=>titleCase(c.name)+", "+c.prov);$("#places").innerHTML=[...new Set(names)].map(n=>`<option value="${esc(n)}"></option>`).join("");})();

function refresh(){renderList();drawSites();drawPatient();updateLabels();}

/* ---------- data freshness: live store, snapshot fallback ---------- */
let mode="snapshot";
function statusText(){const v=metaInfo&&metaInfo.lastVerified?metaInfo.lastVerified:SNAPSHOT_DATE;
  return mode==="live"?`Live data, synced from the shared directory when the page opened. Last verified ${esc(v)}.`:`Directory verified ${esc(SNAPSHOT_DATE)} and refreshed every Sunday.`;}
function setStatus(m){mode=m;$("#status").innerHTML=m==="live"?`<span class="dot live"></span><span>Live data · verified ${esc(metaInfo&&metaInfo.lastVerified||SNAPSHOT_DATE)}</span>`:m==="loading"?`<span class="dot"></span><span>Fetching latest data…</span>`:`<span class="dot"></span><span>Verified ${esc(SNAPSHOT_DATE)} · updated weekly</span>`;renderList();}
async function connect(){
  setStatus("loading");
  let db=null;try{db=window.claude&&claude.use?await claude.use("db"):null;}catch{}
  if(!db){setStatus("snapshot");return;}
  const timer=setTimeout(()=>{if(mode==="loading")setStatus("snapshot");},10000);
  try{db.doc("meta/info").onSnapshot(s=>{if(s.exists){metaInfo=s.data();if(mode==="live")setStatus("live");}},()=>{});}catch{}
  try{db.collection("doctors").onSnapshot(snap=>{clearTimeout(timer);
      if(snap.empty){setStatus("snapshot");return;}
      const fresh=sanitize(snap.docs.map(d=>d.data()));if(!fresh.length){setStatus("snapshot");return;}
      doctors=fresh;computeRanking();refresh();setStatus("live");
    },()=>{clearTimeout(timer);setStatus("snapshot");});
  }catch{clearTimeout(timer);setStatus("snapshot");}
}

/* theme changes restyle the vector basemap */
const restyle=()=>{drawBase();drawPatient();};
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",restyle);
new MutationObserver(restyle).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

updateLabels();refresh();
setTimeout(()=>map.invalidateSize(),50);
const start=()=>connect();
if(window.claude)start();else setTimeout(start,300);
})();
</script>
